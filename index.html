<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheep Roundup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Background image -->
        <div class="background-wrapper">
            <img class="background-image" src="images/Untitled_Artwork (2).png" alt="">
        </div>
        
        <!-- Text box -->
        <div class="textbox-wrapper">
            <img class="textbox-image" src="images/Untitled_Artwork (3).png" alt="">
        </div>
        
        <!-- Dialogue text -->
        <div class="dialogue-text">
            <p>Howdy pardner, you must be the</p>
            <p>new sheep herd. I'm mighty glad</p>
            <p>yer here, five of our sheep got</p>
            <p>out and I'm too old to go chasing</p>
            <p>em.</p>
        </div>
        
        <!-- Character name -->
        <p class="character-name">Shep</p>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
